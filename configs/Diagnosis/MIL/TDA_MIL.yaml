General:
  MODEL_NAME: TDA_MIL
  seed: 42
  num_classes: 2
  num_epochs: 50
  device: 0
  num_workers: 4
  best_model_metric: macro_f1
  earlystop:
    use: true
    patience: 30
    metric: macro_f1
  checkpoint:
    save_mode: every_epoch
    spe:
      metric: macro_f1
      stability_threshold: 0.003
      min_consecutive: 5
      max_checkpoints: 5
Dataset:
  DATASET_NAME: HOptimus1_10x_Reinhard
  comparison_group: MIL
  representation: h-optimus-1
  magnification: 10x
  stain_normalization: Reinhard
  dataset_csv_path: null
  dataset_root_dir: datasets/Diagnosis/MIL
  balanced_sampler:
    use: false
    replacement: true
Logs:
  log_root_dir: result/Diagnosis/MIL
Model:
  in_dim: 1536
  embed_dim: 512
  num_layers: 2
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.1
  attn_dropout: 0.1
  td_mlp_ratio: 2.0
  clamp_min: 0.0
  clamp_max: 1.0
  force_cls_score: 1.0
  share_weights_step12: true
  max_seq_len: 2048
  optimizer:
    which: adam
    adam_config:
      lr: 0.0002
      weight_decay: 1.0e-05
    adamw_config:
      lr: 0.0002
      weight_decay: 1.0e-05
  criterion:
    loss: ce
  scheduler:
    warmup: 2
    which: step
    step_config:
      step_size: 3
      gamma: 0.9
    multi_step_config:
      milestones:
      - 20
      - 30
      - 40
      gamma: 0.9
    exponential_config:
      gamma: 0.9
    cosine_config:
      T_max: 10
      eta_min: 0.0001
