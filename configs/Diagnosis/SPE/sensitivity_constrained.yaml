experiment:
  name: sensitivity_constrained
  device: cuda:0
  num_workers: 0
  preload: false
  classification_threshold: 0.5
  development_dataset_root: datasets/Diagnosis/Stains/Reinhard
  independent_test_dataset_root: datasets/Diagnosis/MIL
  output_root: result/Diagnosis/SPE

checkpoint_selection:
  strategy: high_performance_band
  metric: bacc
  metric_tolerance: 0.005
  max_checkpoints: 5

weighting:
  diversity_lambda: 0.05
  class_balance: true
  max_iterations: 5000
  tolerance: 1.0e-10

# First reconstruct the BAcc OOF ensemble as the sensitivity reference. Then
# search equal-weight architecture subsets and choose the highest threshold
# satisfying reference sensitivity. Among feasible subsets maximize OOF
# specificity, followed by BAcc and sensitivity.
aggregation:
  strategy: sensitivity_constrained_subset
  sensitivity_margin: 0.0
  min_members: 1
  max_members: 8
  reference_selection:
    min_members: 2
    max_members: 6
    min_cv_improvement: 0.001
    max_individual_bacc_gap: 0.10

selection:
  enabled: false

architectures:
  - name: AB_MIL
    config: configs/Diagnosis/MIL/AB_MIL.yaml
    run_dir: null
