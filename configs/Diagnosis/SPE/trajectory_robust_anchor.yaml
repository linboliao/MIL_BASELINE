experiment:
  name: trajectory_robust_anchor
  device: cuda:0
  num_workers: 0
  preload: false
  classification_threshold: 0.5
  development_dataset_root: datasets/Diagnosis/MIL_Mix
  independent_test_dataset_root: datasets/Diagnosis/MIL
  output_root: result/Diagnosis/SPE

# Use validation trajectories only. Prefer a contiguous high-performance basin:
# every state stays close to the fold's best BAcc/Macro-F1 and the whole window
# is stable in BAcc, sensitivity, and specificity. If class-wise stability is
# unavailable, relax class ranges first and only then fall back to the original
# high-performance band. Independent-test labels never enter this decision.
checkpoint_selection:
  strategy: high_performance_stable_basin
  metric: bacc
  metric_tolerance: 0.005
  secondary_metric: macro_f1
  secondary_metric_tolerance: 0.005
  min_consecutive: 5
  metric_range_tolerance: 0.003
  sensitivity_range_tolerance: 0.010
  specificity_range_tolerance: 0.010
  max_checkpoints: 5
  allow_fallback: true

weighting:
  diversity_lambda: 0.02
  class_balance: true

aggregation:
  strategy: top1_anchor_fallback

  # General development-only anchor rule. BAcc first defines an equivalence
  # set; calibration and trajectory/fold stability choose inside that set.
  anchor_selection:
    strategy: bacc_equivalent_maximin_stable
    bacc_noninferiority_margin: 0.002
    max_sensitivity_drop: 0.005
    calibration_tolerance: 0.001
    state_variance_tolerance: 1.0e-5
    use_state_variance: true
    require_state_variance: true

  # Complements receive at most 20% total weight and can act only where the
  # automatically selected anchor is uncertain.
  anchor_min_weight: 0.80
  weight_grid_step: 0.01
  anchor_confidence_low: 0.20
  anchor_confidence_high: 0.80
  min_override_agreement: 1

  # BAcc, sensitivity, and specificity remain deployment constraints. Among
  # feasible blends: Macro-F1 -> AUROC -> AP -> log loss -> simplicity.
  bacc_noninferiority_margin: 0.003
  max_oof_sensitivity_drop: 0.005
  max_oof_specificity_drop: 0.010
  secondary_metric_tolerance: 0.001
  min_non_decreasing_folds: 4
  min_non_decreasing_sensitivity_folds: 4
  fold_tolerance: 0.005
  fold_sensitivity_tolerance: 0.005

selection:
  min_members: 2
  # One complement keeps the cross-fitted grid small and the deployed rule
  # interpretable; the complement must itself support any anchor class flip.
  max_members: 2
  min_cv_improvement: 0.0
  max_individual_bacc_gap: 0.03
  max_individual_sensitivity_gap: 0.01

# Immutable training runs make trajectory and checkpoint selection reproducible.
architectures:
  - name: AB_MIL
    config: configs/Diagnosis/MIL/AB_MIL.yaml
