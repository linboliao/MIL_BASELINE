experiment:
  name: hierarchical_spe_macro_f1
  device: cuda:0
  num_workers: 0
  preload: false
  classification_threshold: 0.5
  development_dataset_root: datasets/Diagnosis/Stains/Reinhard
  independent_test_dataset_root: datasets/Diagnosis/MIL
  output_root: result/Diagnosis/SPE

# Use the final validation-stable interval already generated from val_macro_f1.
checkpoint_selection:
  strategy: precomputed_stability
  metric: macro_f1

# Macro F1 is thresholded and non-differentiable. The inner continuous fit uses
# a class/patient-balanced surrogate; held-out member selection below is scored
# directly with macro F1 at the locked 0.5 threshold.
weighting:
  diversity_lambda: 0.05
  class_balance: true
  max_iterations: 5000
  tolerance: 1.0e-10

aggregation:
  strategy: weighted_mean

selection:
  enabled: true
  objective: macro_f1
  min_members: 2
  max_members: 6
  min_cv_improvement: 0.001
  max_individual_macro_f1_gap: 0.10

# run_dir: null selects the latest complete five-fold run containing an SPE
# checkpoint selection in every fold. Pin explicit directories for a locked run.
architectures:
  - name: AB_MIL
    config: configs/Diagnosis/MIL/AB_MIL.yaml
    run_dir: null
  - name: CLAM_SB_MIL
    config: configs/Diagnosis/MIL/CLAM_SB_MIL.yaml
    run_dir: null
  - name: CLAM_MB_MIL
    config: configs/Diagnosis/MIL/CLAM_MB_MIL.yaml
    run_dir: null
  - name: TRANS_MIL
    config: configs/Diagnosis/MIL/TRANS_MIL.yaml
    run_dir: null
  - name: WIKG_MIL
    config: configs/Diagnosis/MIL/WIKG_MIL.yaml
    run_dir: null
  - name: MAMBA2D_MIL
    config: configs/Diagnosis/MIL/MAMBA2D_MIL.yaml
    run_dir: null
  - name: AEM_MIL
    config: configs/Diagnosis/MIL/AEM_MIL.yaml
    run_dir: null
  - name: MICO_MIL
    config: configs/Diagnosis/MIL/MICO_MIL.yaml
    run_dir: null
  - name: MSM_MIL
    config: configs/Diagnosis/MIL/MSM_MIL.yaml
    run_dir: null
  - name: TDA_MIL
    config: configs/Diagnosis/MIL/TDA_MIL.yaml
    run_dir: null
  - name: GDF_MIL
    config: configs/Diagnosis/MIL/GDF_MIL.yaml
    run_dir: null
