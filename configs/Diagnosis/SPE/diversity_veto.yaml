experiment:
  # Uses cached BAcc trajectories; write into a separate experiment folder.
  name: diversity_veto
  device: cuda:0
  num_workers: 0
  preload: false
  classification_threshold: 0.5
  development_dataset_root: datasets/Diagnosis/Stains/Reinhard
  independent_test_dataset_root: datasets/Diagnosis/MIL
  output_root: result/Diagnosis/SPE

checkpoint_selection:
  strategy: high_performance_band
  metric: bacc
  metric_tolerance: 0.005
  max_checkpoints: 5

# BAcc is the primary endpoint. Select the best OOF-BAcc member as the anchor,
# then select the accurate member with the least-correlated OOF residuals as a
# negative veto. The final probability is min(anchor_prob, veto_prob), so a
# positive prediction requires both complementary members to agree.
aggregation:
  strategy: diversity_veto
  max_veto_bacc_gap: 0.03

weighting:
  diversity_lambda: 0.05
  class_balance: true
  max_iterations: 5000
  tolerance: 1.0e-10

# diversity_veto performs its own fully OOF-based two-role selection.
selection:
  enabled: false

