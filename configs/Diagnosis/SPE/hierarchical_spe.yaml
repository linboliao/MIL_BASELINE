experiment:
  name: hierarchical_spe_v1
  device: cuda:0
  num_workers: 0
  preload: false
  classification_threshold: 0.5
  development_dataset_root: datasets/Diagnosis/Stains/Reinhard
  independent_test_dataset_root: datasets/Diagnosis/MIL_PatientDisjoint
  output_root: result/Diagnosis/SPE

# The manuscript specifies accurate, complementary architecture members but
# leaves the exact objective to an unavailable Supplementary Methods section.
# This implementation fits on patient-equal OOF development predictions only:
# binary cross-entropy + diversity_lambda * residual-correlation penalty.
weighting:
  diversity_lambda: 0.05
  max_iterations: 5000
  tolerance: 1.0e-10

# run_dir: null selects the latest complete five-fold run containing an SPE
# checkpoint selection in every fold. Pin explicit run directories before the
# final locked paper evaluation.
architectures:
  - name: AB_MIL
    config: configs/Diagnosis/MIL/AB_MIL.yaml
    run_dir: null
  - name: CLAM_SB_MIL
    config: configs/Diagnosis/MIL/CLAM_SB_MIL.yaml
    run_dir: null
  - name: CLAM_MB_MIL
    config: configs/Diagnosis/MIL/CLAM_MB_MIL.yaml
    run_dir: null
  - name: TRANS_MIL
    config: configs/Diagnosis/MIL/TRANS_MIL.yaml
    run_dir: null
  - name: WIKG_MIL
    config: configs/Diagnosis/MIL/WIKG_MIL.yaml
    run_dir: null
  - name: MAMBA2D_MIL
    config: configs/Diagnosis/MIL/MAMBA2D_MIL.yaml
    run_dir: null
  - name: AEM_MIL
    config: configs/Diagnosis/MIL/AEM_MIL.yaml
    run_dir: null
  - name: MICO_MIL
    config: configs/Diagnosis/MIL/MICO_MIL.yaml
    run_dir: null
  - name: MSM_MIL
    config: configs/Diagnosis/MIL/MSM_MIL.yaml
    run_dir: null
  - name: TDA_MIL
    config: configs/Diagnosis/MIL/TDA_MIL.yaml
    run_dir: null
  - name: GDF_MIL
    config: configs/Diagnosis/MIL/GDF_MIL.yaml
    run_dir: null
