experiment:
  name: hierarchical_spe_v1
  device: cuda:0
  num_workers: 0
  preload: false
  classification_threshold: 0.5
  development_dataset_root: datasets/Diagnosis/Stains/Reinhard
  independent_test_dataset_root: datasets/Diagnosis/MIL
  output_root: result/Diagnosis/SPE

# The manuscript specifies accurate, complementary architecture members but
# leaves the exact objective to an unavailable Supplementary Methods section.
# This implementation fits on patient-equal OOF development predictions only:
# binary cross-entropy + diversity_lambda * residual-correlation penalty.
weighting:
  diversity_lambda: 0.05
  max_iterations: 5000
  tolerance: 1.0e-10

# Candidate membership is locked from development OOF predictions before the
# final weight fit. Forward selection refits on four folds and accepts a member
# only when it improves patient-equal log loss on the held-out fold.
selection:
  enabled: true
  min_members: 2
  max_members: 6
  min_cv_improvement: 0.001
  require_better_than_null: true
  max_individual_log_loss_gap: 0.10

# run_dir: null selects the latest complete five-fold run containing an SPE
# checkpoint selection in every fold. Pin explicit run directories before the
# final locked paper evaluation.
architectures:
  - name: AB_MIL
    config: configs/Diagnosis/MIL/AB_MIL.yaml
    run_dir: null
  - name: CLAM_SB_MIL
    config: configs/Diagnosis/MIL/CLAM_SB_MIL.yaml
    run_dir: null
  - name: CLAM_MB_MIL
    config: configs/Diagnosis/MIL/CLAM_MB_MIL.yaml
    run_dir: null
