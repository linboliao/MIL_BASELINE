experiment:
  # Risk-controlled ensemble: preserve the strongest development OOF model
  # and spend only a small probability budget on complementary architectures.
  name: best_state_anchor
  device: cuda:0
  num_workers: 0
  preload: false
  classification_threshold: 0.5
  development_dataset_root: datasets/Diagnosis/Stains/Reinhard
  independent_test_dataset_root: datasets/Diagnosis/MIL
  output_root: result/Diagnosis/SPE

# Match the direct baseline exactly at state level: one Best_EPOCH checkpoint
# per fold. This deliberately abandons the manuscript's stable-state average.
checkpoint_selection:
  strategy: best_state

weighting:
  diversity_lambda: 0.02
  class_balance: true

aggregation:
  strategy: top1_anchor_fallback
  # The OOF Top1 always owns at least 70% of the deployed probability mass.
  anchor_min_weight: 0.70
  # Directly optimize the BAcc endpoint over the small complement budget.
  weight_grid_step: 0.01
  # Deploy the ensemble only for a >=0.5 percentage-point OOF BAcc gain.
  min_oof_bacc_gain: 0.005
  # It must also be non-decreasing in at least four of the five OOF folds.
  min_non_decreasing_folds: 4
  fold_tolerance: 0.0

selection:
  # Top1 plus at most two complementary members keeps the intervention small
  # and the resulting decision easy to explain.
  min_members: 2
  max_members: 3
  min_cv_improvement: 0.001
  max_individual_bacc_gap: 0.05

architectures:
  - name: AB_MIL
    config: configs/Diagnosis/MIL/AB_MIL.yaml
    run_dir: result/Diagnosis/MIL/HOptimus1_10x_Reinhard/AB_MIL/seed_42_2026-08-03-02-21
  - name: CLAM_SB_MIL
    config: configs/Diagnosis/MIL/CLAM_SB_MIL.yaml
    run_dir: result/Diagnosis/MIL/HOptimus1_10x_Reinhard/CLAM_SB_MIL/seed_42_2026-08-01-23-53
  - name: CLAM_MB_MIL
    config: configs/Diagnosis/MIL/CLAM_MB_MIL.yaml
