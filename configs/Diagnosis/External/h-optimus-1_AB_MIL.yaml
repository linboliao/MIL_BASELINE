General:
  MODEL_NAME: AB_MIL
  seed: 42
  num_classes: 2
  num_epochs: 50
  device: 0
  num_workers: 4
  best_model_metric: macro_f1
  earlystop:
    use: true
    patience: 30
    metric: macro_f1
  checkpoint:
    save_mode: every_epoch
    spe:
      metric: macro_f1
      stability_threshold: 0.003
      min_consecutive: 5
      max_checkpoints: 5

Dataset:
  DATASET_NAME: Diagnosis_External_HOptimus1_10x_Reinhard
  comparison_group: External
  representation: h-optimus-1
  magnification: 10x
  stain_normalization: Reinhard
  dataset_csv_path: datasets/Diagnosis/External/h-optimus-1/external_test_h-optimus-1.csv
  dataset_root_dir: {}
  split: test
  type_column: test_type
  center_column: center
  balanced_sampler:
    use: false
    replacement: true

Evaluation:
  entrypoint: test_mil.py
  expected_samples: 521
  feature_path_prefix: /NAS145/liaolinbo/Data/MXB/外部测试/feat/Reinhard/pt_files/h-optimus-1
  feature_paths_available_on_current_windows_host: false
  note: Use an h-optimus-1 checkpoint with input dimension 1536; virchow2 checkpoints are incompatible.

Logs:
  log_root_dir: result/Diagnosis/External/h-optimus-1

Model:
  in_dim: 1536
  L: 512
  D: 128
  dropout: 0.1
  act: relu
  optimizer:
    which: adam
    adam_config:
      lr: 0.0002
      weight_decay: 1.0e-05
    adamw_config:
      lr: 0.0002
      weight_decay: 1.0e-05
  criterion:
    loss: ce
  scheduler:
    warmup: 2
    which: step
    step_config:
      step_size: 3
      gamma: 0.9
    multi_step_config:
      milestones: [20, 30, 40]
      gamma: 0.9
    exponential_config:
      gamma: 0.9
    cosine_config:
      T_max: 10
      eta_min: 0.0001
